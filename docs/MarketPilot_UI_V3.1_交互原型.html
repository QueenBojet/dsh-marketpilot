<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.58}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #8bb7f6;outline-offset:2px}a{color:inherit}.frame{display:flex;height:100dvh;min-height:660px}.dsh-rail{width:60px;flex:none;background:#142744;color:#aec1dd;display:flex;flex-direction:column;align-items:center;gap:18px;padding:17px 8px}.dsh-brand{width:33px;height:33px;background:#446ca3;border-radius:10px;display:grid;place-items:center;font-size:16px;font-weight:750;color:white}.railbtn{border:0;background:transparent;color:inherit;width:38px;height:38px;border-radius:10px;font-size:19px}.railbtn.selected{background:#345078;color:white}.railbottom{margin-top:auto;font-size:11px;text-align:center;color:#8c9eb6;writing-mode:vertical-rl}.shell{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:68px;min-height:68px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:16px}.logo{display:flex;align-items:center;gap:12px}.logoMark{background:#1c4b91;color:white;width:33px;height:33px;display:grid;place-items:center;border-radius:10px;font-weight:800;letter-spacing:-2px}.logo strong{font-size:16px}.logo small{font-size:11px;color:var(--secondary);display:block;margin-top:-3px}.topright{display:flex;align-items:center;gap:8px}.chip{background:var(--surface2);color:var(--secondary);border:1px solid var(--border);padding:5px 9px;border-radius:30px;font-size:11px}.navbtn{padding:8px 12px;border:0;color:var(--secondary);background:transparent;border-radius:9px;margin-right:3px}.navbtn.active{background:var(--primarysoft);color:var(--primary);font-weight:700}.main{flex:1;min-height:0;overflow:auto;padding:32px clamp(20px,3vw,48px)}.container{max-width:1380px;margin:auto}.section-title{font-weight:700;font-size:23px;letter-spacing:-.4px;margin:0}.sub{color:var(--secondary);font-size:13px;margin:5px 0 20px}.line{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--border);padding:9px 14px;background:var(--surface);color:var(--ink);border-radius:10px;font-weight:600;font-size:13px}.btn:hover{background:var(--surface2)}.btn.primary{background:#1c4b91;color:white;border-color:#1c4b91}.btn.primary:hover{background:#163b70}.btn:disabled{opacity:.48;cursor:not-allowed}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric{padding:18px 20px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}.metric-label{font-size:12px;color:var(--secondary)}.metric-num{font-size:26px;line-height:1.3;font-weight:750;margin-top:6px}.metric-hint{font-size:11px;color:var(--tertiary);margin-top:4px}.content-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.8fr);gap:18px;margin-top:20px}.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:var(--shadow);min-width:0}.cardhead{font-size:15px;font-weight:700;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center}.more{color:var(--primary);font-size:12px;cursor:pointer;background:none;border:0}.item{padding:13px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:center}.item:last-child{border:0;padding-bottom:0}.item:first-child{padding-top:0}.item b{font-size:13px}.dim{font-size:12px;color:var(--secondary)}.tag{display:inline-flex;padding:4px 9px;border-radius:20px;font-size:11px;background:var(--surface2);border:1px solid var(--border);color:var(--secondary);font-weight:600;white-space:nowrap}.tag.good{background:var(--greensoft);color:var(--green);border-color:transparent}.tag.warn{background:var(--ambersoft);color:var(--amber);border-color:transparent}.tag.blue{background:var(--primarysoft);color:var(--primary);border-color:transparent}.tag.bad{background:var(--redsoft);color:var(--red);border-color:transparent}.prjheading{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:16px}.eyebrow{font-size:12px;color:var(--secondary);margin-bottom:7px}.prjstats{display:flex;flex-wrap:wrap;gap:18px;font-size:12px;color:var(--secondary);margin:10px 0 22px}.prjstats strong{color:var(--ink)}.layout{display:grid;grid-template-columns:224px minmax(0,1fr);gap:20px;align-items:start}.sidenav{position:sticky;top:12px;display:flex;flex-direction:column;gap:5px;padding:13px;background:var(--surface);border:1px solid var(--border);border-radius:14px}.sideheading{font-size:11px;font-weight:700;color:var(--tertiary);padding:8px 10px 5px}.sideitem{display:flex;align-items:center;width:100%;text-align:left;gap:10px;border:0;border-radius:9px;background:transparent;color:var(--secondary);padding:10px;font-size:13px}.sideitem.active{background:var(--primarysoft);color:var(--primary);font-weight:700}.sideitem .dot{width:20px;height:20px;flex:none;border-radius:50%;background:var(--surface2);border:1px solid var(--border);font-size:11px;display:grid;place-items:center;color:var(--secondary)}.sideitem.done .dot{background:var(--greensoft);color:var(--green);border-color:transparent}.sideitem.active .dot{background:var(--primary);color:white;border-color:transparent}.workspace{min-width:0}.step-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px}.step-title h2{font-size:18px;margin:0}.note{padding:12px 15px;border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.note strong{display:block;font-size:13px}.note span{font-size:12px;color:var(--secondary)}.tablebox{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:auto}.table{border-collapse:collapse;width:100%;text-align:left;font-size:13px}.table th{background:var(--surface2);font-size:11px;color:var(--secondary);font-weight:650;padding:12px 14px;white-space:nowrap;border-bottom:1px solid var(--border)}.table td{border-bottom:1px solid var(--border);padding:14px;vertical-align:middle}.table tr:last-child td{border:0}.table tbody tr:hover td{background:var(--surface2)}.textbtn{background:none;border:0;padding:2px;color:var(--primary);font-weight:600;font-size:12px}.filter{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}.filterbtn{border:1px solid var(--border);color:var(--secondary);background:var(--surface);font-size:12px;padding:7px 10px;border-radius:8px}.filterbtn.active{background:var(--primarysoft);border-color:transparent;color:var(--primary);font-weight:700}.search{margin-left:auto;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--ink);padding:8px 12px;font-size:12px;min-width:200px}.stage-note{font-size:12px;color:var(--secondary);margin-bottom:12px}.stagefoot{margin-top:16px;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}.option-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.option{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--surface);cursor:pointer;min-width:0}.option.selected{border-color:var(--primary);box-shadow:0 0 0 2px var(--primarysoft)}.option h3{margin:0 0 6px;font-size:15px}.option ul{padding-left:18px;margin:10px 0;font-size:12px;color:var(--secondary)}.option p{font-size:12px;color:var(--secondary)}.option .pillnum{font-weight:750;font-size:26px;margin:4px 0;color:var(--ink)}.drawerMask{position:fixed;inset:0;background:rgba(10,23,44,.35);z-index:20;display:flex;justify-content:flex-end}.drawer{height:100%;width:min(480px,94vw);background:var(--surface);display:flex;flex-direction:column;box-shadow:-8px 0 40px rgba(0,0,0,.12)}.drawerTop{border-bottom:1px solid var(--border);padding:22px 26px;display:flex;align-items:center;justify-content:space-between}.drawerBody{padding:26px;overflow:auto}.drawerBody h4{font-size:12px;text-transform:uppercase;color:var(--tertiary);margin:24px 0 8px}.quote{border-left:3px solid var(--primary);padding:12px 15px;background:var(--surface2);border-radius:0 9px 9px 0}.modalMask{position:fixed;inset:0;z-index:25;background:rgba(10,23,44,.45);display:grid;place-items:center;padding:16px}.modal{background:var(--surface);border-radius:16px;padding:24px;max-width:480px;width:100%;box-shadow:0 15px 55px rgba(0,0,0,.15)}.modal textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--surface2);color:var(--ink);min-height:95px;resize:vertical}.reader{display:grid;grid-template-columns:190px minmax(0,1fr);gap:14px}.toc{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:12px;align-self:start;position:sticky;top:0}.toc a{display:block;text-decoration:none;font-size:12px;color:var(--secondary);padding:9px 7px;border-radius:7px}.toc a:hover{background:var(--primarysoft);color:var(--primary)}.document{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:24px 28px;line-height:1.85;min-height:400px}.document h3{scroll-margin-top:20px;border-bottom:1px solid var(--border);padding-bottom:9px}.toast{position:fixed;bottom:22px;right:22px;z-index:30;background:#203d62;color:#fff;border-radius:11px;padding:12px 18px;box-shadow:0 8px 25px #0c182833;font-size:13px}.hidden{display:none!important}@media(max-width:1150px){.option-grid{grid-template-columns:1fr}.layout{grid-template-columns:185px minmax(0,1fr)}.metric-grid{grid-template-columns:repeat(2,1fr)}.content-grid{grid-template-columns:1fr}}@media(max-width:760px){.dsh-rail{display:none}.top{padding:0 14px}.main{padding:18px 14px}.navbtn{padding:7px}.logo small{display:none}.layout{display:block}.sidenav{position:static;flex-direction:row;overflow:auto;margin-bottom:14px;padding:8px}.sideheading{display:none}.sideitem{white-space:nowrap}.metric-grid{grid-template-columns:repeat(2,1fr)}.reader{display:block}.toc{position:static;margin-bottom:12px}.topright .chip{display:none}.search{margin-left:0;min-width:140px}}

<body>
<div class="frame"><aside class="dsh-rail" aria-label="DSH 宿主导航示意"><div class="dsh-brand">D</div><button class="railbtn" title="DSH 会话示意">◈</button><button class="railbtn selected" title="MarketPilot">▤</button><div class="railbottom">DSH 宿主示意</div></aside>
<div class="shell"><header class="top"><div class="logo"><div class="logoMark">MP</div><div><strong>MarketPilot</strong><small>市场与技术方案智能工作台</small></div></div><nav aria-label="顶部导航"><button class="navbtn active" data-view="home">工作台</button><button class="navbtn" data-view="projects">我的项目</button><button class="navbtn" data-view="tasks">任务中心</button></nav><div class="topright"><span class="chip">演示数据 · 未连接 DSH</span><button class="btn" id="theme" aria-label="切换浅色/深色">◑</button></div></header><main class="main" id="root"></main></div></div>
<div class="drawerMask hidden" id="drawerMask"><section class="drawer" role="dialog" aria-modal="true"><div class="drawerTop"><strong id="drawerTitle">详情</strong><button class="btn" id="closeDrawer">关闭</button></div><div class="drawerBody" id="drawerBody"></div></section></div><div class="modalMask hidden" id="modalMask"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="line between"><h3 id="modalTitle" style="margin:0 0 14px">人工决策示意</h3><button class="btn" id="closeModal">关闭</button></div><p class="dim">此页面仅演示交互。不会调用真实审批接口或修改 DSH 数据。</p><textarea id="reason" placeholder="请输入审核理由…"></textarea><div class="actions" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="cancelModal">取消</button><button class="btn primary" id="confirmModal">在原型中确认</button></div></section></div><div class="toast hidden" id="toast" role="status"></div>
<script>
const state={view:'home',section:'overview',project:'CALM 单点系泊漏油监测',filter:'all',search:'',selected:['r1','r2'],route:'B',confirmed:false};
const reqs=[{id:'r1',label:'R-001',name:'系统支持 24 h 连续运行',type:'功能',priority:'MUST',status:'confirmed',source:'需求摘录.md'},{id:'r2',label:'R-002',name:'覆盖水面和水下管系泄漏监测',type:'功能',priority:'MUST',status:'confirmed',source:'需求摘录.md'},{id:'r3',label:'R-003',name:'异常事件自动分级报警与留存',type:'功能',priority:'MUST',status:'proposed',source:'需求摘录.md'},{id:'r4',label:'R-004',name:'最小可检出泄漏率需现场试验确认',type:'性能',priority:'MUST',status:'unknown',source:'设计边界.md'},{id:'r5',label:'R-005',name:'支持通信中断缓存与恢复后补传',type:'接口',priority:'SHOULD',status:'proposed',source:'需求摘录.md'}];
const evid=[{id:'e1',title:'水面监测需要多源协同',kind:'SOURCE',status:'verified',source:'技术方案摘录',statement:'油污雷达用于区域监测，双光谱用于辅助复核，现场条件需试验确认。'},{id:'e2',title:'现场最低检漏率未冻结',kind:'UNKNOWN',status:'draft',source:'设计边界',statement:'需通过现场试验和验收协议确认最小可检出泄漏率。'},{id:'e3',title:'红外对全部油膜保持高灵敏度',kind:'INFERENCE',status:'draft',source:'红外专题评估',statement:'待核验的泛化陈述；不能自动视为全工况保证。'}];
const stages=[['overview','项目概览','○'],['requirements','客户需求','✓'],['research','竞品与政策','◉'],['evidence','证据核验','○'],['alternatives','路线比选','○'],['solution','技术方案','○'],['tender','招标审查','○'],['artifacts','成果中心','◇']];
const q=s=>document.querySelector(s); const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tag=(s,mode)=>`<span class="tag ${mode||''}">${esc(s)}</span>`;
function metric(num,title,desc){return `<div class="metric"><div class="metric-label">${title}</div><div class="metric-num">${num}</div><div class="metric-hint">${desc}</div></div>`}
function home(){return `<div class="container"><div class="line between" style="margin-bottom:25px"><div><div class="eyebrow">MarketPilot / 工作台</div><h1 class="section-title">今天的市场工作</h1><p class="sub">查看进行中的项目、待审核事项与最近成果。</p></div><button class="btn primary" data-action="go-project">打开 CALM 项目 →</button></div><div class="metric-grid">${metric('1','进行中的项目','示例项目')}${metric('3','待审核事项','2 条需求 · 1 条证据')}${metric('1','当前任务','竞品研究 · 演示')}${metric('5','项目成果','已记录的模拟成果')}</div><div class="content-grid"><div class="card"><h2 class="cardhead">最近项目 <button class="more" data-view="projects">查看所有 →</button></h2><div class="item"><div><b>CALM 单点系泊漏油监测</b><div class="dim">智能海工感知 · 水面/水下多源融合</div></div><div class="actions">${tag('方案设计中','blue')}<button class="btn" data-action="go-project">继续工作</button></div></div></div><div class="card"><h2 class="cardhead">需要处理</h2><div class="item"><div><b>2 条需求等待确认</b><div class="dim">请检查来源原文与澄清问题</div></div><button class="textbtn" data-section="requirements">去审核 →</button></div><div class="item"><div><b>1 条证据需要复核</b><div class="dim">UNKNOWN 不能自动确认为事实</div></div><button class="textbtn" data-section="evidence">查看 →</button></div><div class="item"><div><b>1 个技术路线决策</b><div class="dim">比较 A / B / C 后选择</div></div><button class="textbtn" data-section="alternatives">比选 →</button></div></div></div><p class="dim" style="margin-top:18px">演示原型：本页统计及工作流数据为虚拟示例，用于确认信息层级与操作方式，不反映你在 DSH 的真实存储。</p></div>`}
function projects(){return `<div class="container"><div class="prjheading"><div><div class="eyebrow">MarketPilot / 项目管理</div><h1 class="section-title">我的项目</h1><p class="sub">选择项目继续需求、调研、比选与投标工作。</p></div><button class="btn primary" data-action="demo-create">＋ 新建项目（原型）</button></div><div class="card"><div class="item"><div><b>CALM 单点系泊漏油监测</b><div class="dim">智能海工感知 / 水面与水下监测</div></div><div class="actions">${tag('进行中','blue')}<button class="btn" data-action="go-project">打开项目 →</button></div></div></div></div>`}
function nav(){return `<nav class="sidenav" aria-label="项目工作阶段"><div class="sideheading">项目阶段</div>${stages.map(([id,name,ico],i)=>`<button class="sideitem ${state.section===id?'active':''} ${i<2?'done':''}" data-section="${id}"><span class="dot">${ico}</span>${name}</button>`).join('')}</nav>`}
function overview(){return `<div class="step-title"><h2>项目工作概览</h2>${tag('需求已解析 · 待证据复核','blue')}</div><div class="note"><div><strong>建议下一步：核查竞品参数的来源</strong><span>已整理客户需求，进入资料核验与方案比选前请处理未知条件。</span></div><button class="btn primary" data-section="research">进入调研 →</button></div><div class="metric-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">${metric('14','需求数量','8 条建议已确认')}${metric('12','未知事项','需要逐项核实')}${metric('3','候选技术路线','需要人工决策')}</div><div class="card" style="margin-top:16px"><h3 class="cardhead">项目进程</h3>${[['资料已导入','4 份脱敏文档','good'],['需求基线已形成','仍有待确认项','good'],['竞品研究','等待参数核验','warn'],['技术路线比选','尚未完成正式审批','']].map(x=>`<div class="item"><div><b>${x[0]}</b><div class="dim">${x[1]}</div></div>${tag(x[2]==='good'?'已完成':x[2]==='warn'?'需复核':'待执行',x[2])}</div>`).join('')}</div>`}
function requirements(){let filtered=reqs.filter(r=>(state.filter==='all'||r.status===state.filter)&&(`${r.label} ${r.name} ${r.source}`).toLowerCase().includes(state.search.toLowerCase()));return `<div class="step-title"><h2>客户需求审核</h2>${tag('有 2 条待确认','warn')}</div><div class="note"><div><strong>需求提取已完成，等待人工核验</strong><span>查看源文、澄清问题与优先级，再提交人工确认。</span></div><button class="btn" data-action="show-workflow">查看真实流程设计</button></div><div class="filter">${[['all','全部'],['proposed','待确认'],['confirmed','已确认'],['unknown','未知条件']].map(([id,name])=>`<button class="filterbtn ${state.filter===id?'active':''}" data-filter="${id}">${name}</button>`).join('')}<input class="search" id="search" aria-label="搜索需求" placeholder="搜索需求或来源…" value="${esc(state.search)}"/></div><div class="tablebox"><table class="table"><thead><tr><th>选择</th><th>编号</th><th>需求表述</th><th>优先级</th><th>状态</th><th>来源</th><th>详情</th></tr></thead><tbody>${filtered.map(r=>`<tr><td><input type="checkbox" data-select="${r.id}" ${state.selected.includes(r.id)?'checked':''}></td><td>${r.label}</td><td>${esc(r.name)}</td><td>${tag(r.priority)}</td><td>${tag(({proposed:'待确认',confirmed:'已确认',unknown:'未知条件'})[r.status],r.status==='confirmed'?'good':r.status==='unknown'?'warn':'')}</td><td class="dim">${esc(r.source)}</td><td><button class="textbtn" data-detail="${r.id}">查看来源 →</button></td></tr>`).join('')}</tbody></table></div><div class="stagefoot"><span class="dim">已选择 ${state.selected.length} 条；此原型不会修改真实需求</span><button class="btn primary" data-action="approve">演示人工审核流程 →</button></div>`}
function research(){return `<div class="step-title"><h2>竞品与行业研究</h2>${tag('本地资料模式','blue')}</div><div class="note"><div><strong>研究范围清晰标识</strong><span>当前展示基于导入资料的示例数据，未声称进行实时联网搜索。</span></div><button class="btn" data-detail="rsearch">查看研究计划</button></div><div class="tablebox"><table class="table"><thead><tr><th>技术方向</th><th>可用方案</th><th>主要关注项</th><th>需要补充</th><th>证据</th></tr></thead><tbody><tr><td>水面监测</td><td>油污雷达 + 双光谱</td><td>覆盖、浪况、复核</td><td>${tag('检测边界','warn')}</td><td><button class="textbtn" data-detail="e1">核验</button></td></tr><tr><td>水下监测</td><td>三维声纳 + UV 油份</td><td>声学环境、误报率</td><td>${tag('现场试验','warn')}</td><td><button class="textbtn" data-detail="e2">核验</button></td></tr><tr><td>红外辅助</td><td>长波红外/可见光</td><td>油水温差、适用条件</td><td>${tag('成熟度','warn')}</td><td><button class="textbtn" data-detail="e3">核验</button></td></tr></tbody></table></div><div class="stagefoot"><span class="dim">3 条研究方向 · 需要核验技术参数</span><button class="btn primary" data-section="evidence">去证据核验 →</button></div>`}
function evidence(){return `<div class="step-title"><h2>证据台账</h2>${tag('2 条需要处理','warn')}</div><div class="note"><div><strong>区分已确认事实、模型推断和未知条件</strong><span>所有关键结论应能追溯到来源；未知项不能因点击而自动升级为事实。</span></div><button class="btn" data-detail="e2">查看未知条件</button></div><div class="tablebox"><table class="table"><thead><tr><th>类型</th><th>结论</th><th>来源</th><th>核验状态</th><th>操作</th></tr></thead><tbody>${evid.map(r=>`<tr><td>${tag(r.kind,r.kind==='UNKNOWN'?'warn':'blue')}</td><td>${esc(r.title)}</td><td>${esc(r.source)}</td><td>${tag(r.status==='verified'?'已核验':'待核验',r.status==='verified'?'good':'warn')}</td><td><button class="textbtn" data-detail="${r.id}">查看证据 →</button></td></tr>`).join('')}</tbody></table></div><div class="stagefoot"><span class="dim">证据核验需要明确来源和责任人</span><button class="btn primary" data-section="alternatives">进入路线比选 →</button></div>`}
function alternatives(){return `<div class="step-title"><h2>技术路线 A / B / C 比选</h2>${tag('需要人工决策','warn')}</div><div class="option-grid">${[['A','雷达 + 双光谱','适用于优先建设水面监测','水面覆盖明确','缺少水下直接证据'],['B','多源水面 + 水下协同','适合水面与水下同时覆盖','结构完整、交叉验证','实施与维护复杂度较高'],['C','近场传感 + 光学复核','适合局部重点区域补充','设备部署灵活','适用范围需要现场验证']].map(x=>`<div class="option ${state.route===x[0]?'selected':''}" data-route="${x[0]}"><div class="line between"><h3>路线 ${x[0]}</h3>${state.route===x[0]?tag('已选作拟议方案','blue'):''}</div><b>${x[1]}</b><p>${x[2]}</p><ul><li>优势：${x[3]}</li><li>限制：${x[4]}</li></ul><div class="dim">点击卡片参与比较，决策需人工确认</div></div>`).join('')}</div><h3 style="font-size:15px;margin:20px 0 10px">需求覆盖矩阵</h3><div class="tablebox"><table class="table"><thead><tr><th>MUST 需求</th><th>路线 A</th><th>路线 B</th><th>路线 C</th></tr></thead><tbody>${[['连续监测','待核验','完全覆盖','部分覆盖'],['水面漏油发现','完全覆盖','完全覆盖','部分覆盖'],['水下管系泄漏','不覆盖','完全覆盖','待核验']].map(x=>`<tr>${x.map((v,i)=>`<td>${i===0?esc(v):tag(v,v==='完全覆盖'?'good':v==='不覆盖'?'bad':'warn')}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="stagefoot"><span class="dim">当前拟议选择：路线 ${state.route} ${state.confirmed?'· 原型已确认':''}</span><button class="btn primary" data-action="approve">填写理由并确认路线 →</button></div>`}
function solution(){return `<div class="step-title"><h2>技术方案阅读器</h2>${tag('草稿 · 未审核','warn')}</div><div class="note"><div><strong>默认查看最新生成版本</strong><span>目录可点击定位；UNKNOWN 与假设应保留。</span></div><button class="btn" data-detail="versions">查看版本</button></div><div class="reader"><nav class="toc" aria-label="章节目录"><b style="font-size:12px;padding:9px;display:block">目录</b>${[['s1','01 项目目标'],['s2','02 设计边界'],['s3','03 技术路线'],['s4','04 系统构成'],['s5','05 未知条件']].map(x=>`<a href="#${x[0]}">${x[1]}</a>`).join('')}</nav><article class="document"><h2 style="margin-top:0">CALM单点系泊漏油监测技术方案</h2><div class="dim">示例文档 · V3.1交互原型 · 内容简化</div><h3 id="s1">01 项目目标</h3><p>对水面与水下漏油开展连续监测，形成事件发现、辅助复核、分级报警与证据留存的完整流程。</p><h3 id="s2">02 设计边界</h3><p>现场海况、实际油温、供电与通信条件、检出概率和误报率等需要进一步确定。</p><h3 id="s3">03 技术路线</h3><p>示例采用雷达、双光谱与水下声学/油份传感器的协同框架。具体配置应由现场约束和人工 Decision 确认。</p><h3 id="s4">04 系统构成</h3><p>传感器层、边缘处理层、事件融合与告警层、岸基应用层。</p><h3 id="s5">05 UNKNOWN / 待确认</h3><div class="quote">最小可检出泄漏率、报警响应保证值和认证范围尚未冻结。正式技术承诺应通过工程试验与来源核验。</div><p class="dim">原型仅演示长文目录、阅读布局和审核标注。真实系统应读取当前 Project Artifact。</p></article></div>`}
function tender(){return `<div class="step-title"><h2>招投标符合性审查</h2>${tag('3 条款 · 演示','blue')}</div><div class="note"><div><strong>没有已核验的证据，不得自动声称“满足”</strong><span>“审查所选”只能处理勾选的行，“审查全部”另设入口。</span></div></div><div class="tablebox"><table class="table"><thead><tr><th><input type="checkbox" id="selectall" checked/></th><th>条款</th><th>要求</th><th>状态</th><th>证据</th><th>查看</th></tr></thead><tbody>${[['t1','4.1','24 h连续监测','部分满足'],['t2','4.2','最小检漏率保证值','待确认'],['t3','4.3','指定认证与证明资料','待确认']].map(x=>`<tr><td><input type="checkbox" class="tenderSelect" data-id="${x[0]}" checked/></td><td>${x[1]}</td><td>${x[2]}</td><td>${tag(x[3],x[3]==='部分满足'?'warn':'')}</td><td class="dim">待核验</td><td><button class="textbtn" data-detail="${x[0]}">查看条款</button></td></tr>`).join('')}</tbody></table></div><div class="stagefoot"><span class="dim" id="selectedCount">已选择3条（仅原型）</span><div class="actions"><button class="btn" data-action="reviewall">查看全部审查说明</button><button class="btn primary" data-action="reviewselected">审查所选 3 条（原型）</button></div></div>`}
function artifacts(){return `<div class="step-title"><h2>项目成果</h2>${tag('示例 · 审核状态清楚','blue')}</div><div class="card">${[['客户需求基线.md','需求基线','已确认'],['竞品分析矩阵.md','调研报告','待审核'],['技术路线比选.md','方案比较','待审核'],['CALM技术方案.md','技术方案','待审核']].map(x=>`<div class="item"><div><b>${x[0]}</b><div class="dim">${x[1]} · 最近生成</div></div><div class="actions">${tag(x[2],x[2]==='已确认'?'good':'warn')}<button class="btn" data-section="solution">预览</button></div></div>`).join('')}</div>`}
function tasks(){return `<div class="container"><div class="eyebrow">MarketPilot / 任务中心</div><h1 class="section-title">工作流任务</h1><p class="sub">查看正在执行、等待审核和已完成的任务。此处展示原型虚拟数据。</p><div class="card">${[['客户需求提取','已完成','真实步骤：提取→规范化→保存','good'],['竞品研究','等待复核','核对厂家型号和证据来源','warn'],['技术方案生成','已完成','15章 Markdown，保留 UNKNOWN','good']].map(x=>`<div class="item"><div><b>${x[0]}</b><div class="dim">${x[2]}</div></div><div class="actions">${tag(x[1],x[3])}<button class="btn" data-action="go-project">打开项目</button></div></div>`).join('')}</div></div>`}
function project(){let page={overview,requirements,research,evidence,alternatives,solution,tender,artifacts}[state.section]();return `<div class="container"><div class="prjheading"><div><div class="eyebrow"><button class="textbtn" data-view="projects">我的项目</button> / 海工感知 / 项目详情</div><h1 class="section-title">${esc(state.project)}</h1><div class="prjstats"><span>${tag('方案设计中','blue')}</span><span><strong>8/14</strong> 需求确认</span><span><strong>12</strong> 未知事项</span><span><strong>3</strong> 候选路线</span></div></div><button class="btn" data-view="tasks">查看任务中心 →</button></div><div class="layout">${nav()}<section class="workspace">${page}</section></div></div>`}
function render(){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view||(state.view==='project'&&b.dataset.view==='projects'))); q('#root').innerHTML=state.view==='home'?home():state.view==='projects'?projects():state.view==='tasks'?tasks():project();}
function setView(v){state.view=v;render();q('.main').scrollTop=0;}function setSection(v){state.view='project';state.section=v;render();q('.main').scrollTop=0;}
function showDrawer(title,body){q('#drawerTitle').textContent=title;q('#drawerBody').innerHTML=body;q('#drawerMask').classList.remove('hidden');q('#closeDrawer').focus();}
function detail(id){let r=reqs.find(x=>x.id===id);if(r){showDrawer(r.label+' · 需求来源',`<h4>标准化需求</h4><p>${esc(r.name)}</p><h4>原文摘录</h4><div class="quote">${esc(r.name)}</div><h4>来源文件</h4><p>${esc(r.source)}</p><h4>下一步操作</h4><p class="dim">真实系统应提供精确来源定位、关联证据和人工审核记录。</p>`);return;}let e=evid.find(x=>x.id===id);if(e){showDrawer(e.title,`<div class="actions">${tag(e.kind,e.kind==='UNKNOWN'?'warn':'blue')}${tag(e.status==='verified'?'已核验':'待核验',e.status==='verified'?'good':'warn')}</div><h4>结论</h4><p>${esc(e.statement)}</p><h4>来源</h4><div class="quote">${esc(e.source)}（原型摘录）</div><h4>核验原则</h4><p class="dim">UNKNOWN 不得默认转 FACT。实际核验需显式选择目标类别、填写理由、关联证据，并经过 Human Gate。</p><button class="btn" data-action="approve">查看人工审核示例</button>`);return;}if(id==='versions')showDrawer('成果版本',`<div class="item"><b>v2 · 最新草稿</b>${tag('最新','blue')}</div><div class="item"><b>v1 · 旧版草稿</b>${tag('历史')}</div><p class="dim">真实系统应依据真实生成时间、Artifact ID 选取最新版本。</p>`);else if(id==='rsearch')showDrawer('研究计划',`<h4>研究目标</h4><p>区分水面广域监测、近场确认和水下泄漏证据；检索厂商原始文件、型号、认证、行业标准。</p><h4>限制</h4><p>演示数据基于本地资料，没有联网搜索结果。</p>`);else showDrawer('条款或资料说明',`<h4>结论</h4><p>此处仅演示详情抽屉布局和核验提示。</p><h4>工程注意</h4><p>正式项目必须显示具体条款原文、响应以及经过审核的证据引用。</p>`);}
let toastTimer;function toast(msg){const e=q('#toast');e.textContent=msg;e.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.add('hidden'),3100)}
q('#theme').onclick=()=>{document.documentElement.toggleAttribute('data-dark');};q('#closeDrawer').onclick=()=>q('#drawerMask').classList.add('hidden');q('#drawerMask').onclick=e=>{if(e.target===q('#drawerMask'))q('#drawerMask').classList.add('hidden')};q('#closeModal').onclick=q('#cancelModal').onclick=()=>q('#modalMask').classList.add('hidden');q('#confirmModal').onclick=()=>{if(!q('#reason').value.trim()){toast('请先输入审核理由');return;}state.confirmed=true;q('#modalMask').classList.add('hidden');toast('已更新原型的人工确认状态；没有修改真实 DSH 项目。');render()};
document.addEventListener('click',e=>{const el=e.target.closest('[data-view],[data-section],[data-detail],[data-action],[data-filter],[data-route]');if(!el)return;if(el.dataset.view)setView(el.dataset.view);else if(el.dataset.section)setSection(el.dataset.section);else if(el.dataset.detail)detail(el.dataset.detail);else if(el.dataset.filter){state.filter=el.dataset.filter;render()}else if(el.dataset.route){state.route=el.dataset.route;render()}else if(el.dataset.action){const a=el.dataset.action;if(a==='go-project')setSection('overview');else if(a==='approve'){q('#reason').value='';q('#modalMask').classList.remove('hidden');q('#reason').focus()}else if(a==='show-workflow')showDrawer('需求审核工作流',`<h4>实际步骤</h4><p>选择资料 → GLM结构化提取 → 需求基线候选 → UNKNOWN → 人工确认 → 版本保存。</p><p class="dim">这里只做点击流程示意，不发起AI请求。</p>`);else if(a==='demo-create')toast('原型不创建真实项目；生产界面将打开项目创建对话框。');else if(a==='reviewall'||a==='reviewselected'){const n=a==='reviewall'?3:[...document.querySelectorAll('.tenderSelect:checked')].length;if(n===0){toast('请先选择至少一条招标条款');return;}toast(`原型已选择 ${n} 条；实际后端必须严格按勾选的条款 ID 提交。`);}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;let pos=e.target.selectionStart;render();let s=q('#search');s.focus();s.setSelectionRange(pos,pos)}});document.addEventListener('change',e=>{if(e.target.matches('[data-select]')){let id=e.target.dataset.select;state.selected=e.target.checked?[...new Set([...state.selected,id])]:state.selected.filter(x=>x!==id)} if(e.target.id==='selectall'){document.querySelectorAll('.tenderSelect').forEach(x=>x.checked=e.target.checked);updateCount()} if(e.target.classList.contains('tenderSelect'))updateCount()});function updateCount(){const n=[...document.querySelectorAll('.tenderSelect:checked')].length;let el=q('#selectedCount');if(el)el.textContent=`已选择${n}条（仅原型）`;let btn=q('[data-action="reviewselected"]');if(btn){btn.textContent=`审查所选 ${n} 条（原型）`;btn.disabled=n===0}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){q('#drawerMask').classList.add('hidden');q('#modalMask').classList.add('hidden')}});
render();
</script>
</body></html>
