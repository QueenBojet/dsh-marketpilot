/* V4.0 concept expansion — professional SaaS visual system */
.phase-banner{display:flex;align-items:center;gap:9px;padding:10px 15px;margin:-9px 0 22px;background:#f0f8fc;border:1px solid #dcebf3;border-radius:11px;font-size:11px;color:#466f88}

.roadmap .unit{display:flex;align-items:center;gap:7px;white-space:nowrap;color:#899bad;font-size:11px}
.roadmap .unit span{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#eaf0f7;font-weight:700;color:#6b8197;font-size:10px}
.roadmap .unit.complete span{background:#daf5ed;color:#168d78}.roadmap .unit.current span{background:#e6efff;color:#2d65d9}
.roadmap .stem{height:1px;background:#dfe8f1;min-width:25px;flex:1}

.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px}

.summary-box .val{font-size:23px;font-weight:750;letter-spacing:-.6px;margin:12px 0 6px;overflow-wrap:anywhere}
.summary-box .detail{font-size:11px;color:#8da0b2;line-height:1.65}
.flexstack{display:flex;flex-direction:column;gap:18px;min-width:0}
.stack-card{border:1px solid #e4eaf2;background:white;border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.stack-hd{padding:20px 23px;border-bottom:1px solid #eef1f6;display:flex;justify-content:space-between;align-items:center;gap:12px}
.stack-hd strong{font-size:15px;font-weight:730}.stack-hd small{display:block;color:#95a4b5;font-size:11px;margin-top:5px}
.stack-body{padding:21px 23px}

.segment button{border:0;border-radius:8px;background:transparent;padding:9px 15px;white-space:nowrap;font-size:11px;font-weight:660;color:#70859d}
.segment button.active{background:#fff;color:#2657bd;box-shadow:0 2px 7px #1a315512}
.route-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

<script>
const icons={home:'<path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2z"/>',folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10H3z"/>',library:'<path d="M5 3v18M9 5v16M13 3v18M17 7l4 13"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',activity:'<path d="M3 12h4l3-7 4 14 3-7h4"/>',file:'<path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/>',diff:'<rect x="3" y="4" width="7" height="16" rx="1"/><rect x="14" y="4" width="7" height="16" rx="1"/><path d="M6 9h2M6 13h2m8-4h2m-2 4h2"/>',microscope:'<path d="m7 21 4-4M5 9l4-4 7 7-4 4zM6 3l2-2 8 8-2 2M4 21h16"/>',settings:'<path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/><path d="M20 12a8 8 0 1 1-16 0 8 8 0 1 1 16 0"/>',check:'<path d="m4 12 5 5L20 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',external:'<path d="M13 4h7v7M20 4l-9 9"/><path d="M20 13v7H4V4h7"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',spark:'<path d="m12 2 2.1 7.9L22 12l-7.9 2.1L12 22l-2.1-7.9L2 12l7.9-2.1z"/>',message:'<path d="M4 5h16v12H7l-3 3z"/>',close:'<path d="M5 5l14 14M19 5 5 19"/>',chev:'<path d="m6 9 6 6 6-6"/>',send:'<path d="m3 11 18-8-8 18-2-8z"/>',layers:'<path d="m12 3 9 5-9 5-9-5zM3 12l9 5 9-5M3 16l9 5 9-5"/>',coins:'<circle cx="12" cy="12" r="9"/><path d="M15 8H11a2 2 0 0 0 0 4h2a2 2 0 0 1 0 4H9m3-10v2m0 8v2"/>',book:'<path d="M12 6c-3-2-6-2-9-1v15c3-1 6-1 9 1m0-15c3-2 6-2 9-1v15c-3-1-6-1-9 1zM12 6v15"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 9-3 8-3 10h18c0-2-3-1-3-10M10 22h4"/>',upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',link:'<path d="M10 13a5 5 0 0 0 8 .6l2-2a5 5 0 0 0-7-7l-2 2M14 11a5 5 0 0 0-8-.6l-2 2a5 5 0 0 0 7 7l2-2"/>',shield:'<path d="m12 2 9 4v6c0 6-4 9-9 10-5-1-9-4-9-10V6z"/>',minimize:'<path d="M8 3H3v5M16 21h5v-5m0-8V3h-5M3 16v5h5"/>',refresh:'<path d="M21 3v6h-6M3 21v-6h6"/><path d="M4 9a8 8 0 0 1 14-4l3 4M3 15l3 4a8 8 0 0 0 14-4"/>'};
function ic(k,s=17){return `<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">${icons[k]||icons.file}</svg>`}
const names={overview:'项目总览',change:'资料与变更',research:'智能研究',solution:'方案与决策',cost:'成本与报价',deliver:'文档与交付',home:'工作台',projects:'我的项目',library:'研究资料库',runs:'运行记录',settings:'设置'};
const state={page:'overview',topic:0,chatOpen:true,analyzed:false,adoptedChange:false,adoptedFinding:false,chat:[{role:'ai',text:'当前正在研究「水下漏油监测技术选型」。你可以让我解释报告、核查证据，或开展新的联网研究。'}],model:'DSH 默认模型',effort:'自动',files:[],planDone:false};
let toastTimer;
function notify(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3900)}
function navItem(id,ico,note=''){return `<button class="nav-item ${state.page===id?'active':''}" onclick="goto('${id}')">${ic(ico)}<span>${names[id]}</span>${note?'<span class="nav-dot"></span>':''}</button>`}
function shell(){document.getElementById('app').innerHTML=`<aside class="sidebar"><div class="brand"><div class="mark">M</div><div><div class="brand-name">MarketPilot <span style="font-weight:450;color:#8aa9c5">智策</span></div><div class="brand-sub">ENGINEERING INTELLIGENCE</div></div></div><div class="nav-cap">WORKSPACE</div>${navItem('home','home')}${navItem('projects','folder')}${navItem('library','library')}${navItem('runs','clock')}<div class="nav-cap">CURRENT PROJECT</div><div class="nav-project"><div class="project-ico">${ic('layers',18)}</div><div><b>CALM 漏油监测</b><small>持续项目 · 原型数据</small></div></div>${navItem('overview','activity')}${navItem('change','diff',!state.adoptedChange)}${navItem('research','microscope')}${navItem('solution','layers')}${navItem('cost','coins')}${navItem('deliver','book')}<div class="nav-bottom">${navItem('settings','settings')}<div class="profile"><span class="avatar">工</span><span>工程师工作空间<small>本机独立网页 · 演示环境</small></span></div></div></aside><div class="main"><header class="topbar"><div class="breadcrumb">工作台 <span>/</span> CALM 漏油监测 <span>/</span> <strong>${names[state.page]||'设置'}</strong></div><div class="tools"><span class="chip-online"><span class="online-dot"></span>DSH 连接 · 目标状态示意</span><button class="icon-btn" title="通知" onclick="notify('此原型演示页面交互，未连接真实通知服务。')">${ic('bell')}</button><button class="icon-btn" title="设置" onclick="goto('settings')">${ic('settings')}</button></div></header><main class="workspace" id="page">${renderPage()}</main></div><div class="mobile-tabbar">${[['overview','home'],['change','diff'],['research','microscope'],['solution','layers'],['deliver','book']].map(([id,ico])=>`<button class="${state.page===id?'active':''}" onclick="goto('${id}')">${ic(ico)}${names[id].slice(0,4)}</button>`).join('')}</div>`}
function goto(page){state.page=page;closeDrawer();closeModal();shell();window.scrollTo({top:0,behavior:'smooth'})}
function renderPage(){if(state.page==='overview')return overview();if(state.page==='research')return research();if(state.page==='change')return changePage();if(state.page==='solution')return solutionPage();if(state.page==='cost')return costPage();if(state.page==='deliver')return deliveryPage();return placeholder()}
function statCard(label,value,foot,ico){return `<div class="card kpi"><div class="kpi-top">${label}<span class="sym">${ic(ico,15)}</span></div><div class="kpi-val">${value}</div><div class="kpi-foot">${foot}</div></div>`}
function overview(){return `<div class="pagehead"><div><div class="eyebrow">PROJECT OVERVIEW / 01</div><h1 class="h1">让工程决策，始终有据可循。</h1><p class="lede">持续跟踪客户需求、研究证据与方案变化。以下均为可点击的交互概念数据。</p></div><div class="actions"><button class="btn" onclick="goto('research')">${ic('microscope',15)} 继续研究</button><button class="btn primary" onclick="openImport()">${ic('upload',15)} 导入新资料</button></div></div><div class="kpi-row">${statCard('当前正式基线',demoState.published?'V2.0':'V1.0','草稿持续演进中','layers')}${statCard('待处理资料变更',state.adoptedChange?'0':'1',state.adoptedChange?'<b>已确认本轮变化</b>':'等待工程师确认','diff')}${statCard('活跃技术问题','3','包含需要进一步论证的事项','microscope')}${statCard('已采纳研究结论',state.adoptedFinding?'5':'4','已保存到项目知识库','book')}</div><div class="overview-grid"><div><div class="card panel"><div class="panel-heading"><div><h2>最新客户信息</h2><p>新资料进入后先形成建议，不直接修改正式基线</p></div><span class="badge warn">待人工处理</span></div><div class="change-card"><div class="circle-icon">${ic('diff',20)}</div><div style="flex:1"><h3>船东补充技术要求 · 新资料批次</h3><p>系统识别到可能涉及水下通信方式及布置约束的补充信息，建议检查相关技术问题、配置和成本。</p><button class="btn small primary" onclick="openChange()">查看变化与影响 ${ic('arrow',13)}</button><div class="source-line">2026-10-12 · 虚构资料示例 · 当前方案未被修改</div></div></div><div class="section-spacer"></div><div class="panel-heading"><div><h2>需要继续处理的技术问题</h2><p>研究结果与技术决策独立管理</p></div><button class="btn text small" onclick="goto('research')">进入研究空间 ${ic('arrow',13)}</button></div><div class="item-list"><div class="list-row"><div class="list-ic">${ic('microscope')}</div><div class="rowtext"><b>水下漏油监测技术选型</b><small>已有研究报告 · 可继续追问或核查来源</small></div><span class="badge teal">研究中</span><button class="btn small" onclick="chooseTopic(0)">继续</button></div><div class="list-row"><div class="list-ic">${ic('link')}</div><div class="rowtext"><b>通信与供电约束</b><small>来自新资料的潜在影响 · 需要进一步确认</small></div><span class="badge warn">待核查</span><button class="btn small" onclick="chooseTopic(1)">研究</button></div><div class="list-row"><div class="list-ic">${ic('shield')}</div><div class="rowtext"><b>水下部署与维护要求</b><small>工程实施条件与设备选型相关</small></div><span class="badge">待整理</span><button class="btn small" onclick="chooseTopic(2)">查看</button></div></div></div></div><div class="right-panel-stack"><div class="baseline"><div class="smallcap">CURRENT APPROVED BASELINE</div><div class="baseline-title">方案基线 ${demoState.published?'V2.0':'V1.0'}</div><p>保留已确认的技术路线、相关依据和成果。新的研究与修改仅进入工作草稿。</p><div class="inline"><span class="tag">${ic('check',12)} 人工发布</span><a onclick="goto('solution')">查看方案版本 →</a></div></div><div class="card panel"><div class="panel-heading"><div><h2>最近工作动态</h2><p>关键动作保留可追溯记录</p></div></div><div class="mini-timeline"><div class="event"><span class="event-dot"></span><div><b>收到一批船东补充信息</b><small>新增资料仅触发候选变更</small></div></div><div class="event"><span class="event-dot"></span><div><b>完成技术研究初稿</b><small>可查看原始引用与结论来源</small></div></div><div class="event"><span class="event-dot"></span><div><b>保存已批准的方案基线</b><small>历史版本保持不变</small></div></div></div></div></div></div><div class="ux-note">MarketPilot V4.0 · 概念原型 / 所有项目记录与技术结论均为示例</div>`}
function changePage(){return `<div class="pagehead"><div><div class="eyebrow">SOURCE & CHANGE / 02</div><h1 class="h1">新信息，不应让原有工作归零。</h1><p class="lede">资料按批次保存；识别建议由 AI 提出，正式要求由工程师确认。</p></div><button class="btn primary" onclick="openImport()">${ic('upload',15)} 导入新资料</button></div><div class="card panel"><div class="panel-heading"><div><h2>资料批次与变更建议</h2><p>显示来源、分析结果、人工处理状态</p></div><span class="badge blue">示例记录</span></div><div class="list-row"><div class="list-ic">${ic('file')}</div><div class="rowtext"><b>船东补充技术要求 · 示例会议纪要</b><small>2026-10-12 · 初步识别通信与布置相关内容</small></div><span class="badge ${state.adoptedChange?'teal':'warn'}">${state.adoptedChange?'已采纳':'需核查'}</span><button class="btn small" onclick="openChange()">打开分析</button></div>${state.files.map(n=>`<div class="list-row"><div class="list-ic">${ic('file')}</div><div class="rowtext"><b>${escapeHtml(n)}</b><small>本地原型仅显示文件名，未解析内容或保存数据</small></div><span class="badge">未分析</span><button class="btn small" onclick="notify('原型未连接文件解析与 DSH 服务。')">查看</button></div>`).join('')}</div><div class="ux-note">交互设计原则：轻量识别与深度分析分开执行</div>`}
const topics=['水下漏油监测技术选型','通信与供电约束','部署与维护条件'];
function chooseTopic(i){state.topic=i;goto('research')}
function research(){const topic=topics[state.topic];return `<div class="pagehead"><div><div class="eyebrow">RESEARCH INTELLIGENCE / 03</div><h1 class="h1">智能研究空间</h1><p class="lede">把搜索、核查、追问与知识沉淀放到同一张研究桌面上。</p></div><div class="actions"><button class="btn" onclick="openPlan()">${ic('spark',15)} 新一轮研究</button><button class="btn primary" onclick="notify('研究报告会进入项目文档草稿；此原型未执行真实导出。')">${ic('file',15)} 保存报告草稿</button></div></div><div class="research-toolbar"><span class="badge blue">当前技术问题：${topic}</span><span class="badge">模拟引用与虚构结论</span><button class="btn small reopen-chat" onclick="toggleChat()">${ic('message',14)} ${state.chatOpen?'收起':'展开'} AI 助手</button></div><div class="research-grid ${state.chatOpen?'':'chat-collapsed'}"><aside class="card research-left"><div class="micro-title">RESEARCH TOPICS</div>${topics.map((t,i)=>`<button class="topic ${state.topic===i?'active':''}" onclick="chooseTopic(${i})"><span></span>${t}</button>`).join('')}<div class="thin-rule"></div><div class="micro-title">REFERENCE SOURCES</div><div class="source-mini" onclick="openEvidence('source')">${ic('file',16)} 产品技术资料 · 示例</div><div class="source-mini" onclick="openEvidence('source')">${ic('external',16)} 外部技术网页 · 示例</div><div class="thin-rule"></div><div class="micro-title">KNOWLEDGE</div><div style="padding:0 9px;font-size:11px;color:#70849b">${state.adoptedFinding?'已采纳 1 项新研究结论':'候选结论等待审核'}</div></aside><article class="card report"><div class="report-top"><span class="report-overline">ENGINEERING RESEARCH NOTE</span><span class="badge teal">可持续研究</span></div><h2>${topic}</h2><div class="report-sub"><span>${ic('clock',13)} 研究记录 · 示例</span><span>·</span><span>来源待人工核查</span><span>·</span><span>当前草稿</span></div><p class="report-intro">本研究围绕 CALM 场景中的工程适用性展开。与一次性的聊天回答不同，研究问题、引用、讨论记录与经审核的结论将持续留存在项目工作区。</p><div class="section-heading">核心研究摘要</div><div class="research-quote">技术选型应结合<span class="focus-mark" onclick="openEvidence('condition')">目标场景的实际适用条件</span>开展论证，同时核查<span class="focus-mark secondary" onclick="openEvidence('source')">设备供应商原始资料与测试条件</span>，再将研究结论关联到具体需求和方案配置。<br><span style="font-size:10px;color:#9aabbd">[S-01] [S-02] 均为演示占位来源，未经过真实联网核查。</span></div><div class="section-heading">候选研究结论</div><div class="finding-list"><div class="finding"><div class="finding-head"><b>设备选型需要关联实际工况</b><span class="badge ${state.adoptedFinding?'teal':'warn'}">${state.adoptedFinding?'已采纳':'待审阅'}</span></div><p>候选结论：在选型前，应确认监测距离、部署方式和接口需求等约束，并在正式方案中保留来源信息。</p><div class="finding-foot"><span class="sources" onclick="openEvidence('condition')">${ic('link',13)} 查看来源与适用条件</span><button class="btn small ${state.adoptedFinding?'teal':'primary'}" onclick="adoptFinding()">${ic(state.adoptedFinding?'check':'plus',13)} ${state.adoptedFinding?'已加入知识库':'采纳为工程结论'}</button></div></div><div class="finding"><div class="finding-head"><b>通信约束需与配置方案联合核查</b><span class="badge">待研究</span></div><p>对于客户新增约束，应先检索已有技术决策与设备资料，再判断其对系统设计和成本的影响。</p><div class="finding-foot"><span class="sources" onclick="openEvidence('source')">${ic('link',13)} 查看参考资料</span><button class="btn small" onclick="chooseTopic(1)">${ic('arrow',13)} 开展专项研究</button></div></div></div><div class="section-heading">关联到现有技术方案</div><div class="boxnote">当前研究与方案草稿保持关联。新的研究结论只有经过工程师采纳，才能成为可引用的项目知识；不会自动替代已批准技术路线。</div></article><aside class="card assistant-panel"><div class="assistant-top"><div class="assistant-title"><div class="assistant-name"><span class="bot-mark">${ic('spark',14)}</span> 项目 AI 助手</div><button class="icon-btn" style="width:27px;height:27px;border:0" onclick="toggleChat()" title="收起 AI 面板">${ic('close',15)}</button></div><div class="selectline"><select id="model" onchange="state.model=this.value;notify('已更新本次任务模型偏好（原型未调用 DSH）。')"><option ${state.model==='DSH 默认模型'?'selected':''}>DSH 默认模型</option><option ${state.model==='GLM-5.3 Flash（示例）'?'selected':''}>GLM-5.3 Flash（示例）</option><option ${state.model==='其他 DSH 模型（示例）'?'selected':''}>其他 DSH 模型（示例）</option></select><select id="effort" onchange="state.effort=this.value;notify('已更新本次任务思考强度（原型未调用 DSH）。')">${['自动','低','中','高'].map(x=>`<option ${state.effort===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="conversation" id="conversation">${state.chat.map(m=>`<div class="bubble ${m.role}">${escapeHtml(m.text)}</div>`).join('')}</div><div class="chat-compose"><textarea id="chatInput" placeholder="针对当前研究主题继续提问…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea><div class="chat-footer"><span class="tiny-caption">仅模拟交互，不调用模型</span><button class="send-btn" onclick="sendChat()" aria-label="发送">${ic('send',16)}</button></div></div></aside></div><div class="ux-note">研究问题、来源与采纳动作均为交互概念 · 无真实数据持久化</div>`}
function toggleChat(){state.chatOpen=!state.chatOpen;shell()}
function sendChat(){const f=document.getElementById('chatInput');if(!f)return;let v=f.value.trim();if(!v)return;state.chat.push({role:'user',text:v});state.chat.push({role:'ai',text:`【模拟回复】已收到关于「${topics[state.topic]}」的问题。正式版本将使用你选择的模型、当前项目资料和经授权的联网检索回答，并附可追溯来源。`});shell();const c=document.getElementById('conversation');if(c)c.scrollTop=c.scrollHeight}
function adoptFinding(){if(!state.adoptedFinding){state.adoptedFinding=true;notify('模拟：候选研究结论已加入项目知识库，并保留来源及人工采纳状态。')}else notify('该结论已被采纳。');shell()}
function placeholder(){let subtitles={home:'从这里继续最近的项目、研究和交付工作。',projects:'长期保存客户项目及其资料、研究、方案和报价。',library:'跨项目的产品资料、标准和工程研究来源将在此管理。',runs:'追踪 DSH 模型任务、工具执行和人工审批。',solution:'技术路线比选、人工决策、设备配置与正式方案版本。',cost:'结构化设备清单、价格依据、成本估算与报价版本。',deliver:'公司 DOCX 模板、章节修订、审阅与正式交付。',settings:'DSH 连接配置、模型偏好、本地数据目录及文档模板。'};return `<div class="pagehead"><div><div class="eyebrow">MARKETPILOT / V4.0</div><h1 class="h1">${names[state.page]||'设置'}</h1><p class="lede">${subtitles[state.page]}</p></div></div><div class="card placeholder-inner"><div class="circle-icon" style="width:54px;height:54px;border-radius:17px">${ic(state.page==='cost'?'coins':state.page==='deliver'?'book':'layers',24)}</div><h2>此区域的详细交互将在后续设计阶段完善</h2><p>本轮概念原型聚焦于两个已确认的核心业务闭环：项目总览与新资料变更，以及智能研究、来源核查和知识采纳。</p><button class="btn primary" onclick="goto('overview')">${ic('arrow',14)} 返回项目总览</button></div>`}
function openDrawer(inner,footer=''){document.getElementById('drawer').innerHTML=`<div class="drawer-top"><div><div class="eyebrow">MARKETPILOT / REVIEW</div><h2>${inner.title}</h2><div style="font-size:11px;color:#95a2b1">${inner.subtitle||'业务操作与引用详情'}</div></div><button class="icon-btn" aria-label="关闭侧栏" onclick="closeDrawer()">${ic('close',17)}</button></div><div class="drawer-scroll">${inner.body}</div><div class="drawer-footer">${footer||`<button class="btn" onclick="closeDrawer()">关闭</button>`}</div>`;document.getElementById('shade').classList.add('open');document.getElementById('drawer').classList.add('open')}
function closeDrawer(){document.getElementById('shade').classList.remove('open');document.getElementById('drawer').classList.remove('open')}
function openChange(){let body=`<div class="fieldcap">来源与记录</div><div class="boxnote">资料批次：示例会议纪要 / 2026-10-12<br>分析状态：${state.analyzed?'已进行模拟深度分析':'轻量识别，等待人工启动深度分析'}<br>真实版本应展示原文页段与可信来源定位。</div><div class="fieldcap">客户要求比较</div><div class="diffbox"><div class="diffrow"><div class="diffcap">原有项目记录</div><p>与水下通信方式有关的部分条件仍需进一步明确。</p></div><div class="diffrow new"><div class="diffcap">新收到的资料（假设示例）</div><p>补充了对通信方式及布置条件的进一步约束，需要与既有系统设计进行对照。</p></div></div><div class="fieldcap">${state.analyzed?'深度影响分析 · 演示结果':'轻量识别 · 可能影响'}</div><div class="impact-item"><span class="mark">${ic('layers',14)}</span>现有通信配置<small>${state.analyzed?'需要核查':'可能关联'}</small></div><div class="impact-item"><span class="mark">${ic('microscope',14)}</span>相关技术研究问题<small>${state.analyzed?'建议继续研究':'建议检查'}</small></div><div class="impact-item"><span class="mark">${ic('coins',14)}</span>成本及报价条目<small>${state.analyzed?'检查费用变化':'可能影响'}</small></div><div class="boxnote" style="margin-top:18px">本页面所有分析均为静态示例；正式版本应通过 DSH 运行真实比对，并区分确定关联与 AI 推测关联。</div>`;let footer=state.adoptedChange?`<button class="btn" onclick="closeDrawer()">关闭</button><button class="btn primary" onclick="chooseTopic(1)">进入关联研究 ${ic('arrow',14)}</button>`:state.analyzed?`<button class="btn" onclick="notify('模拟：已标记该事项为待客户确认，未修改正式需求。');closeDrawer()">待客户确认</button><button class="btn primary" onclick="acceptChange()">${ic('check',14)} 采纳为工作需求</button>`:`<button class="btn" onclick="closeDrawer()">暂不分析</button><button class="btn primary" onclick="deepAnalyze()">${ic('spark',14)} 启动深度分析</button>`;openDrawer({title:'新资料变更核查',subtitle:'先核实来源，再决定是否采纳',body},footer)}
function deepAnalyze(){state.analyzed=true;openChange();notify('模拟深度分析已完成：发现可能关联的配置、技术问题及成本项。')}
function acceptChange(){state.adoptedChange=true;closeDrawer();shell();notify('模拟：已采纳到工作草稿。正式 V1.0 保持不变。')}
function openEvidence(kind){let txt=kind==='condition'?'关键内容：技术选型需要核查其所适用的实际工况、测试前提和工程接口。':'关键内容：研究报告引用的供应商资料或外部网页需要实际获取原文后才能作为已核查来源。';openDrawer({title:'研究来源与引用',subtitle:'出处与研究结论一一对应',body:`<div class="fieldcap">引用内容</div><div class="boxnote">${txt}</div><div class="fieldcap">来源元数据</div><div class="impact-item">来源编号 <small>S-01 / 演示占位</small></div><div class="impact-item">资料类型 <small>本地文档 / 外部网页</small></div><div class="impact-item">核查状态 <small>演示数据 · 尚未核查</small></div><div class="fieldcap">原文与证据链</div><div class="diffbox"><div class="diffrow"><div class="diffcap">示意引用片段</div><p>正式产品将保存来源 URL、采集时间、引用原文、页码或段落定位、证据状态以及必要的网页快照。</p></div></div><div class="boxnote" style="margin-top:18px">本原型没有绑定真实的外部网页。正式产品中，“打开原网页”将在有真实来源时启用。</div>`},`<button class="btn" onclick="notify('演示来源没有真实 URL，未执行外部跳转。')">${ic('external',14)} 打开原网页（演示）</button><button class="btn primary" onclick="closeDrawer();adoptFinding()">${ic('plus',14)} 保存为研究依据</button>`)}
function openImport(){const body=`<h2>导入客户补充资料</h2><div class="subtitle">本机交互演示只保留文件名；不读取或上传文件内容，也不会运行 AI 分析。</div><div style="border:1.5px dashed #bbcee8;background:#f7fafe;border-radius:12px;padding:25px;text-align:center;margin-top:20px"><div style="color:#376adc">${ic('upload',26)}</div><p style="font-size:12px;color:#667d94;margin:10px 0">选择一份本地资料</p><input id="demoFile" type="file" style="max-width:100%;font-size:11px" accept=".txt,.md,.pdf,.docx,.xlsx,.doc,.xls"/></div><div class="boxnote" style="margin-top:18px">目标规则：先归档和轻量识别，再由用户决定是否启动深度分析。</div><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="importDemo()">加入示例资料列表</button></div>`;openModal(body)}
function importDemo(){const el=document.getElementById('demoFile');if(!el?.files?.length){notify('请先选择一份文件。');return}state.files.push(el.files[0].name);closeModal();goto('change');notify('已加入演示列表（仅文件名）。真实导入与 AI 分析尚未执行。')}
function openPlan(){const body=`<h2>新一轮智能研究</h2><p class="subtitle">AI 先组织研究范围，由工程师确认后启动。这是研究计划交互演示，不会真正联网或调用 DSH。</p><div class="fieldcap">当前研究主题</div><div class="boxnote">${topics[state.topic]}</div><div class="fieldcap">选择研究资料</div><label class="check-row"><input type="checkbox" checked> <span>当前项目已上传的客户与技术资料</span></label><label class="check-row"><input type="checkbox" checked> <span>已有研究结论及已确认工程决策</span></label><label class="check-row"><input type="checkbox" checked> <span>互联网资料搜索与原文读取（正式功能）</span></label><div class="fieldcap">本次模型执行</div><div class="boxnote">${escapeHtml(state.model)} · 思考强度：${escapeHtml(state.effort)}<br>实际可选选项应从 DSH 动态获取。</div><div class="modal-actions"><button class="btn" onclick="closeModal()">返回调整</button><button class="btn primary" onclick="startPlan()">确认研究计划</button></div>`;openModal(body)}
function startPlan(){state.planDone=true;closeModal();notify('已确认研究范围（模拟）。正式版本将启动 DSH 研究任务并返回真实来源。')}
function openModal(inner){document.getElementById('overlay').innerHTML=`<div class="modal">${inner}</div>`;document.getElementById('overlay').classList.add('open')}
function closeModal(){document.getElementById('overlay').classList.remove('open')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeModal()}});

function stateCta(t){return `<button class="btn small ${t.style||''}" onclick="${t.action}">${t.icon?ic(t.icon,13):''} ${t.title}</button>`}
function secondHead(small,title,desc,actions=''){return `<div class="pagehead"><div><div class="eyebrow">${small}</div><h1 class="h1">${title}</h1><p class="lede">${desc}</p></div><div class="actions">${actions}</div></div>`}

function workRoadmap(){return `<div class="roadmap"><div class="unit complete"><span>✓</span>资料与研究</div><div class="stem"></div><div class="unit ${demoState.decisionConfirmed?'complete':'current'}"><span>${demoState.decisionConfirmed?'✓':'2'}</span>路线与配置</div><div class="stem"></div><div class="unit ${demoState.costReviewed?'complete':'current'}"><span>${demoState.costReviewed?'✓':'3'}</span>成本核算</div><div class="stem"></div><div class="unit ${demoState.docReviewed?'complete':'current'}"><span>${demoState.docReviewed?'✓':'4'}</span>文档审阅</div><div class="stem"></div><div class="unit ${demoState.published?'complete':'current'}"><span>${demoState.published?'✓':'5'}</span>人工发布</div></div>`}
function solutionPage(){
 const action=`<button class="btn" onclick="goto('research')">${ic('microscope',15)} 查看研究依据</button><button class="btn primary" onclick="openPublish()">${ic('check',15)} 发布新方案基线</button>`;

function deliveryPage(){return secondHead('DOCUMENT & DELIVERY / 06','文档与交付','技术方案与成本清单共用项目数据，按指定模板编辑章节、审阅并关联正式版本。',`<button class="btn" onclick="openTemplate()">${ic('file',15)} 选择模板</button><button class="btn primary" onclick="openDocReview()">${ic('check',15)} ${demoState.docReviewed?'文档已审阅':'审阅文档草稿'}</button>`)+noteBanner()+
 `<div class="summary-grid"><div class="summary-box"><div class="cap">${ic('file',14)} 当前文档模板</div><div class="val" style="font-size:17px">${escapeHtml(demoState.chosenTemplate)}</div><div class="detail">正式功能应提供 DOCX 模板保真与章节映射</div></div><div class="summary-box"><div class="cap">${ic('diff',14)} 待同步内容</div><div class="val">${demoState.docUpdated?'0':'2'}</div><div class="detail">示意：系统组成及通信约束章节</div></div><div class="summary-box"><div class="cap">${ic('shield',14)} 文档审核状态</div><div class="val" style="font-size:20px">${demoState.docReviewed?'人工已审阅':'待工程师审阅'}</div><div class="detail">草稿审核后仍需人工发布方案基线</div></div></div>`+
 `<div class="doc-layout"><div class="flexstack"><div class="stack-card"><div class="stack-hd"><div><strong>项目交付工作区</strong><small>切换文档，而不是从头重复编写</small></div></div><div class="stack-body"><div class="doc-list"><button class="doc-item ${demoState.documentTab==='technical'?'active':''}" onclick="switchDocument('technical')">${ic('file',15)} <span>CALM 技术方案草稿</span>${ic('arrow',13)}</button><button class="doc-item ${demoState.documentTab==='estimate'?'active':''}" onclick="switchDocument('estimate')">${ic('coins',15)} <span>成本与报价说明</span>${ic('arrow',13)}</button><button class="doc-item ${demoState.documentTab==='compare'?'active':''}" onclick="switchDocument('compare')">${ic('diff',15)} <span>V1.0 与草稿变更摘要</span>${ic('arrow',13)}</button></div><div class="thin-rule"></div><div class="fieldcap" style="margin-top:12px">关联的业务内容</div><div class="mini-step ${demoState.decisionConfirmed?'done':''}"><span class="num">1</span><div><strong>技术决策</strong><small>${demoState.decisionConfirmed?'已确认草稿路线':'待确认'} · <a style="color:#3262cc;cursor:pointer" onclick="goto('solution')">打开</a></small></div></div><div class="mini-step ${demoState.costReviewed?'done':''}"><span class="num">2</span><div><strong>成本估算</strong><small>${demoState.costReviewed?'已人工核查':'带限制条件的未核价草稿'} · <a style="color:#3262cc;cursor:pointer" onclick="goto('cost')">打开</a></small></div></div><div class="mini-step ${demoState.docReviewed?'done':''}"><span class="num">3</span><div><strong>文档审阅</strong><small>${demoState.docReviewed?'已记录人工审阅':'等待人工审核'}</small></div></div></div></div><div class="stack-card"><div class="stack-hd"><div><strong>修改建议</strong><small>只修改受影响章节</small></div></div><div class="stack-body"><div class="reconcile-note">${ic('diff',15)} ${demoState.docUpdated?'已完成示意性章节同步。需要重新审阅才能批准。':'客户新资料可能涉及通信描述与系统组成，建议局部更新而不是重写整篇。'}</div><button class="btn primary" style="width:100%;margin-top:15px" onclick="updateChapters()">${ic('spark',14)} ${demoState.docUpdated?'重新准备章节草稿':'更新受影响章节'}</button></div></div></div><div class="flexstack"><div class="stack-card"><div class="stack-hd"><div><strong>文档实时预览</strong><small>内容来自当前草稿，版式为演示样式</small></div><div class="actions"><span class="badge ${demoState.docReviewed?'teal':'warn'}">${demoState.docReviewed?'已审阅':'草稿'}</span><button class="btn small" onclick="openExportInfo()">${ic('external',13)} 导出说明</button></div></div><div class="stack-body" style="background:#f5f7fb">${docPaper()}</div></div></div></div><div class="ux-note">DOCX 模板解析、版式保真和实际文件导出不属于本静态原型的功能。</div>`}
function docPaper(){if(demoState.documentTab==='technical')return `<article class="paper"><div class="paper-cap">MARKETPILOT / DOCUMENT DRAFT</div><h1>CALM 单点系泊漏油监测<br>技术方案</h1><div class="minor">公司技术方案模板 · 概念预览 / 示例内容</div><div class="paper-rule"></div><h3>1. 项目背景与任务目标</h3><p>本文件展示 MarketPilot 如何复用既有项目需求、研究结论和技术决策生成结构化技术方案。此处为交互演示，不包含真实项目的工程选型结论。</p><h3>2. 系统组成与技术路线</h3><p>工作草稿暂采用路线 ${demoState.activeRoute==='a'?'A（监测与数据采集一体化）':'B（分布式监测与岸端分析）'}。${demoState.docUpdated?'已根据当前草稿配置同步章节示意内容。':'新增技术约束对应的章节内容仍待人工核查与局部修订。'}</p><table class="paper-table"><tr><th>示例配置项</th><th>数量</th><th>状态</th></tr>${demoState.config.slice(0,3).map(x=>`<tr><td>${escapeHtml(x.name)}</td><td>${x.qty}</td><td>${escapeHtml(x.source)}</td></tr>`).join('')}</table><h3>3. 数据与通信</h3><p>${demoState.docUpdated?'根据当前工作草稿记录了本轮通信技术要求的关联情况；具体通信参数仍须依据船东正式资料与厂家手册核查。':'检测到可能受船东补充资料影响的通信章节，建议开展证据核查后再确认。'}</p><h3>4. 价格与实施说明</h3><p>当前成本试算 ${yen(estimatedCost())}，属于虚构演示数据，不代表真实工程报价；正式文档应依据可靠来源更新。</p></article>`;
 if(demoState.documentTab==='estimate')return `<article class="paper"><div class="paper-cap">MARKETPILOT / COST NOTE</div><h1>项目成本测算说明</h1><div class="minor">工作草稿 · 非正式报价</div><div class="paper-rule"></div><h3>一、费用明细</h3><table class="paper-table"><tr><th>费用类别</th><th>合计</th></tr><tr><td>直接成本</td><td>${yen(subTotal())}</td></tr><tr><td>风险预留（演示 5%）</td><td>${yen(reserve())}</td></tr><tr><td>测算合计</td><td>${yen(estimatedCost())}</td></tr></table><h3>二、说明与限制</h3><p>本例采用虚构单价，供应商报价来源未核实，税费和商务利润均未计入。不具备对外报价效力。</p></article>`;
 return `<article class="paper"><div class="paper-cap">MARKETPILOT / CHANGE SUMMARY</div><h1>方案版本变化摘要</h1><div class="minor">V1.0 正式基线 → 当前工作草稿</div><div class="paper-rule"></div><h3>一、需求变化</h3><p>${state.adoptedChange?'已在草稿中采纳示例客户要求，需复核技术影响。':'新增资料尚未人工采纳，正式需求保持不变。'}</p><h3>二、技术路线</h3><p>当前方案路线：${demoState.activeRoute==='a'?'A · 监测与数据采集一体化':'B · 分布式监测与岸端分析'}。人工决策状态：${demoState.decisionConfirmed?'已确认':'待确认'}。</p><h3>三、设备和成本</h3><p>草稿共有 ${demoState.config.length} 项配置，预计成本 ${yen(estimatedCost())}（全部为演示数据），需要人工核价。</p><h3>四、交付范围</h3><p>文档状态：${demoState.docReviewed?'已审阅':'待审阅'}。正式发布操作将冻结完整项目基线，不覆盖历史 V1。</p></article>`;
}
function switchDocument(k){demoState.documentTab=k;shell()}
function openTemplate(){openModal(`<h2>选择交付文档模板</h2><p class="subtitle">该原型只展示模板切换交互；正式版需支持公司 DOCX 模板导入、结构映射与版式保真。</p><label class="form-label">可用模板</label><select class="option-select" id="templatePick"><option ${demoState.chosenTemplate.startsWith('公司')?'selected':''}>公司技术方案模板 · 演示</option><option ${demoState.chosenTemplate.startsWith('项目')?'selected':''}>项目建议书模板 · 演示</option><option ${demoState.chosenTemplate.startsWith('调研')?'selected':''}>调研报告模板 · 演示</option></select><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="applyTemplate()">使用此模板</button></div>`)}
function applyTemplate(){demoState.chosenTemplate=document.getElementById('templatePick').value;demoState.docReviewed=false;closeModal();shell();notify('模板选择已更新（仅演示），正式 DOCX 映射与排版未执行。')}
function updateChapters(){demoState.docUpdated=true;demoState.docReviewed=false;shell();notify('模拟：已标记受影响章节为已同步草稿，尚未执行 AI 改写。')}
function openDocReview(){openModal(`<h2>审阅交付文档草稿</h2><p class="subtitle">确认的是草稿当前内容及已知限制，不等于正式交付给船东。</p><div class="review-list"><label class="review-check"><input type="checkbox" id="docChk1"><span>已检查当前技术路线和配置表述。</span></label><label class="review-check"><input type="checkbox" id="docChk2"><span>已了解研究结论、价格以及来源中仍存在的待核查项。</span></label><label class="review-check"><input type="checkbox" id="docChk3"><span>已检查本次演示文档中的修改范围与限制条件。</span></label></div><div class="modal-actions"><button class="btn" onclick="closeModal()">返回修订</button><button class="btn primary" onclick="confirmDocReview()">记录人工审阅</button></div>`)}
function confirmDocReview(){if(!['docChk1','docChk2','docChk3'].every(id=>document.getElementById(id)?.checked)){notify('请先完成三项文档审阅确认。');return}demoState.docReviewed=true;closeModal();shell();notify('演示：文档草稿已完成记录式审阅，可进入人工基线发布。')}
function openExportInfo(){openModal(`<h2>正式文档导出规则</h2><p class="subtitle">本 HTML 仅为交互原型，不提供实际 DOCX 或 PDF 生成。</p><div class="boxnote">正式版应允许：<br>• 导入和维护公司模板；<br>• 映射正文、参数表与费用清单；<br>• 仅更新受变更影响的章节；<br>• 审阅后导出 DOCX / PDF；<br>• 记录文档版本及实际交付记录。</div><div class="modal-actions"><button class="btn primary" onclick="closeModal()">了解</button></div>`)}
function changePublishProfile(value){demoState.publishProfile=value;openPublish()}
function openPublish(){
 const full=demoState.publishProfile==='full';
 const items=[['decision',demoState.decisionConfirmed,'本轮技术路线已人工确认'],['doc',demoState.docReviewed,'交付文档草稿已人工审阅']];
 if(full)items.splice(1,0,['cost',demoState.costReviewed,'本轮成本测算限制已核查']);
 const ready=items.every(x=>x[1]);
 openModal(`<h2>${demoState.published?'正式方案 V2.0 已发布（演示）':'发布新的正式方案基线'}</h2><p class="subtitle">发布会冻结本次选定范围的草稿记录，不会修改历史 V1.0。不同交付类型拥有不同检查要求。</p><label class="form-label">本次发布范围</label><select class="option-select" onchange="changePublishProfile(this.value)" ${demoState.published?'disabled':''}><option value="full" ${full?'selected':''}>完整方案包 · 技术方案 + 成本测算 + 文档</option><option value="technical" ${!full?'selected':''}>技术方案基线 · 不纳入商务成本审核</option></select><div class="boxnote" style="margin-top:13px">${full?'完整方案包包含技术决策、配置、带限制的成本测算和文档。':'技术方案基线冻结技术决策、配置和技术文档，成本测算可保持独立草稿。'}</div><div class="fieldcap">发布前检查</div><div class="review-list">${items.map(it=>`<div class="review-check">${ic(it[1]?'check':'clock',15)} <span style="flex:1">${it[2]}</span><span class="badge ${it[1]?'teal':'warn'}">${it[1]?'完成':'待完成'}</span></div>`).join('')}</div>${!ready?'<div class="reconcile-note" style="margin-top:18px">相关人工审核尚未完成。请补充核查后再发布。</div>':''}<div class="modal-actions"><button class="btn" onclick="closeModal()">返回草稿</button>${ready&&!demoState.published?'<button class="btn primary" onclick="finalizeBaseline()">人工确认并发布 V2.0</button>':demoState.published?'<button class="btn primary" onclick="closeModal()">关闭</button>':'<button class="btn" onclick="closeModal();goto(\'deliver\')">去完成审阅</button>'}</div>`)
}
function finalizeBaseline(){demoState.publishedSnapshot={version:'V2.0',profile:demoState.publishProfile,route:demoState.activeRoute,config:JSON.parse(JSON.stringify(demoState.config)),estimate:demoState.publishProfile==='full'?estimatedCost():null,template:demoState.chosenTemplate,reviewed:true,scenario:'fictional-prototype'};demoState.published=true;closeModal();goto('solution');notify('已模拟发布 V2.0 并保存只读快照；V1.0 历史基线保持不变。')}

shell();
</script>
</body>
</html>
